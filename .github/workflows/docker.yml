name: docker image

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start with compose
        run: |
          cp .env.example .env
          sed -i "s|^OBSIDIAN_HOST_DIR=.*|OBSIDIAN_HOST_DIR=./vault|; s|^APP_UID=.*|APP_UID=$(id -u)|; s|^APP_GID=.*|APP_GID=$(id -g)|" .env
          mkdir -p data vault
          docker compose up -d --build
      - name: Wait until healthy
        run: |
          for i in $(seq 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' "$(docker compose ps -q server)")" = healthy ] && exit 0
            sleep 2
          done
          docker compose logs
          exit 1
      - name: Smoke test
        run: |
          curl -fsS localhost:3000/api/health
          curl -fsS -o /dev/null localhost:3000/
          curl -fsS -XPOST localhost:3000/api/users -H 'Content-Type: application/json' -d '{"name":"ci"}'
          test -f data/vocab.db
      - name: Stops promptly on SIGTERM
        run: timeout 8 docker compose stop
      - if: always()
        run: docker compose logs
