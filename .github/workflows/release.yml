name: release

# Push a tag like v2.0.0 to build a signed APK and publish it as a GitHub release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Check the tag matches versionName
        run: |
          version=$(sed -n 's/^ *versionName = "\(.*\)"/\1/p' app/build.gradle.kts)
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME but versionName is $version"; exit 1; }

      - name: Restore the release key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          [ -n "$KEYSTORE_BASE64" ] || { echo "secret KEYSTORE_BASE64 is not set (see README, Releases)"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Test and build
        env:
          VOCAB_KEYSTORE: ${{ runner.temp }}/release.jks
          VOCAB_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          VOCAB_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          VOCAB_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew testDebugUnitTest assembleRelease --console=plain

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="kindlevocab-$GITHUB_REF_NAME.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          gh release create "$GITHUB_REF_NAME" "$apk" --title "kindlevocab $GITHUB_REF_NAME" --generate-notes
