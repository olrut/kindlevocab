services:
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    ports: ["${PORT:-3000}:3000"]
    env_file: .env
    environment:
      # Fixed inside the container; the host side is set by the volumes below.
      DATA_DIR: /app/data
      PORT: "3000"
    # Files in data/ and the vault are owned by this host user.
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    volumes:
      - ./data:/app/data
      - ${OBSIDIAN_HOST_DIR:-./vault}:/app/vault
    restart: unless-stopped
